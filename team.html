  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lb-name">
    <button class="lightbox-close" type="button" id="lb-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" id="lb-prev" aria-label="Previous person">&#8249;</button>
    <button class="lightbox-nav lightbox-next" type="button" id="lb-next" aria-label="Next person">&#8250;</button>
    <figure>
      <img id="lb-img" src="" alt="">
      <figcaption>
        <p class="lb-name" id="lb-name"></p>
        <p class="lb-role" id="lb-role"></p>
        <p class="lb-inst" id="lb-inst"></p>
        <div class="lb-detail" id="lb-detail">
          <p class="lb-bio" id="lb-bio"></p>
          <p class="lb-award" id="lb-award"></p>
        </div>
      </figcaption>
    </figure>

  <script>
    (function () {
      var photos = Array.prototype.slice.call(document.querySelectorAll('.photo'));
      if (!photos.length) return;

      var box = document.getElementById('lightbox');
      var img = document.getElementById('lb-img');
      var name = document.getElementById('lb-name');
      var role = document.getElementById('lb-role');
      var inst = document.getElementById('lb-inst');
      var bio = document.getElementById('lb-bio');
      var award = document.getElementById('lb-award');
      var detail = document.getElementById('lb-detail');
      var closeBtn = document.getElementById('lb-close');
      var prevBtn = document.getElementById('lb-prev');
      var nextBtn = document.getElementById('lb-next');
      var current = -1;

      // Fill a caption line, and drop it entirely when there is nothing
      // to say — otherwise a missing institution or bio leaves a gap.
      function set(el, value) {
        var text = (value || '').trim();
        el.textContent = text;
        el.hidden = !text;
      }

      function show(i) {
        current = (i + photos.length) % photos.length;
        var btn = photos[current];
        var thumb = btn.querySelector('img');
        img.src = thumb.src;
        img.alt = thumb.alt;
        set(name, btn.dataset.name);
        set(role, btn.dataset.role);
        set(inst, btn.dataset.inst);
        set(bio, btn.dataset.bio);
        setAward(btn.dataset);
        // The divider belongs to the block, so hide it when it is empty.
        detail.hidden = bio.hidden && award.hidden;
      }

      // Built with DOM nodes rather than innerHTML. When an award number is
      // given the number itself is the link; otherwise the label is.
      function setAward(d) {
        var url = (d.awardUrl || '').trim();
        award.textContent = '';
        award.hidden = !url;
        if (!url) return;

        var label = (d.awardLabel || 'Award').trim();
        var id = (d.awardId || '').trim();
        var link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';

        if (id) {
          award.appendChild(document.createTextNode(label + ' '));
          link.textContent = id;
        } else {
          link.textContent = label;
        }
        award.appendChild(link);
      }

      function open(i) {
        show(i);
        box.hidden = false;
        document.body.style.overflow = 'hidden';
        closeBtn.focus();
      }

      function close() {
        box.hidden = true;
        document.body.style.overflow = '';
        if (document.activeElement) document.activeElement.blur();
      }

      photos.forEach(function (btn, i) {
        btn.addEventListener('click', function () { open(i); });
      });

      closeBtn.addEventListener('click', close);
      prevBtn.addEventListener('click', function () { show(current - 1); });
      nextBtn.addEventListener('click', function () { show(current + 1); });

      // Only a click on the backdrop itself dismisses, not one on the figure.
      box.addEventListener('click', function (e) {
        if (e.target === box) close();
      });

      document.addEventListener('keydown', function (e) {
        if (box.hidden) return;
        if (e.key === 'Escape') {
          close();
        } else if (e.key === 'ArrowLeft') {
          show(current - 1);
        } else if (e.key === 'ArrowRight') {
          show(current + 1);
        } else if (e.key === 'Tab') {
          // Trap focus on the dialog's own controls while it is open.
          var f = [closeBtn, prevBtn, nextBtn];
          var i = f.indexOf(document.activeElement);
          if (i === -1) {
            closeBtn.focus();
            e.preventDefault();
            return;
          }
          var next = e.shiftKey ? i - 1 : i + 1;
          if (next < 0 || next >= f.length) {
            f[e.shiftKey ? f.length - 1 : 0].focus();
            e.preventDefault();
          }
        }
      });
    })();
  </script>
